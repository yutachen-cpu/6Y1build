    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color-scheme: light; }
      
      /* Default state: Hide print-only elements on screen */
      .print-only { display: none; }

      @media print {
        @page { 
          margin: 0.5cm; 
          size: A4 portrait;
        }
        
        /* CRITICAL FIX: Reset all layout constraints that might block printing */
        html, body, #root, main, div {
          height: auto !important;
          overflow: visible !important;
          background-color: white !important;
        }

        /* Hide interactive elements */
        .no-print { display: none !important; }
        
        /* Show print elements */
        .print-only { display: block !important; }
        
        /* Ensure table borders print correctly */
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black !important; }
        
        /* Force background colors for headers */
        .bg-blue-200 { background-color: #bfdbfe !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
    </style>
